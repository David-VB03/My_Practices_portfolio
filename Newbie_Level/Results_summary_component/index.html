<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="/style.css">
  <title>Frontend Mentor | Results summary component</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <!--<style>
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>-->

</head>

<body>

  <main class="card">
    <div class="card__result">
      <p class="card__result--title">Your Result</p>
      <div class="card__score">
        <h1 class="card__score--value">76</h1>
        <span class="card__score--total">of 100</span>
      </div>
      <div class="card__description">
        <p class="card__rating">Great</p>
        <p class="card__message">
          You scored higher than 65% of the people who have taken these tests.
        </p>
      </div>
    </div>
    <div class="card__summary">
      <h3 class="card__summary--title">Summary</h3>
      <ul class="card__topics">
        <li class="card__topic card__topic--first">
          <span class="card__topic--label1"> <img src="./assets/images/icon-reaction.svg" alt=""> Reaction</span>
          <p> 80 <strong>/ 100</strong></p>
        </li>
        <li class="card__topic card__topic--second">
          <span class="card__topic--label2"> <img src="./assets/images/icon-memory.svg" alt=""> Memory</span>
          <p> 92 <strong>/ 100</strong></p>
        </li>
        <li class="card__topic card__topic--third">
          <span class="card__topic--label3"> <img src="./assets/images/icon-verbal.svg" alt=""> Verbal</span>
          <p> 61 <strong>/ 100 </strong></p>
        </li>
        <li class="card__topic card__topic--fourth">
          <span class="card__topic--label4"> <img src="./assets/images/icon-visual.svg" alt=""> Visual</span>
          <p>72 <strong>/ 100</strong></p>
        </li>
      </ul>
      <button type="submit" class="card__button">Continue</button>

    </div>
  </main>

</body>

</html>
